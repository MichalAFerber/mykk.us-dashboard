<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — MyKK Dashboard</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="That page does not exist. Head back to your MyKK start page.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#667eea">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.2);
    --glass-shadow: rgba(0, 0, 0, 0.3);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.8);
    --focus-ring: rgba(102, 126, 234, 0.8);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-attachment: fixed;
    color: var(--text-primary);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  main {
    max-width: 32rem; text-align: center;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px var(--glass-shadow);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-radius: 18px; padding: 44px 36px;
  }
  img.mark { width: 64px; height: 64px; margin: 0 auto 20px; display: block; }
  .code { font-size: 3.25rem; font-weight: 700; line-height: 1; margin: 0 0 10px; letter-spacing: .02em; }
  h1 { font-size: 1.35rem; font-weight: 600; line-height: 1.3; margin: 0 0 12px; }
  p.lede { color: var(--text-secondary); margin: 0 0 28px; }
  a.home {
    display: inline-block; padding: 12px 26px; border-radius: 10px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    color: var(--text-primary); text-decoration: none; font-weight: 600;
  }
  a.home:hover { background: rgba(255, 255, 255, 0.18); }
  a.home:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/favicon.svg" alt="" width="64" height="64">
  <p class="code">404</p>
  <h1>That page does not exist</h1>
  <p class="lede">The link may be out of date, or the address mistyped. Your start page is one click away.</p>
  <a class="home" href="/">Back to MyKK</a>
</main>
</body>
</html>
